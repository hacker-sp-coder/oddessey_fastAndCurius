services:
  ai-service:
    build:
      context: ./backend/ai-service
      dockerfile: Dockerfile
    container_name: screenai-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AI_PORT=8000
      - AI_HOST=0.0.0.0
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-fallback}
      - EVALUATION_PROVIDER=${EVALUATION_PROVIDER:-deterministic}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_TRANSCRIPTION_MODEL=${GROQ_TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - TEMP_STORAGE_DIR=/app/storage/temp
      - FIXTURES_DIR=/app/fixtures
    volumes:
      - ./storage:/app/storage
      - ./fixtures:/app/fixtures:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: screenai-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - AI_SERVICE_URL=http://ai-service:8000
      - DATABASE_PATH=/app/storage/pitches.db
      - UPLOAD_DIR=/app/storage/uploads
      - TEMP_DIR=/app/storage/temp
      - FIXTURES_DIR=/app/fixtures
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-100}
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - ./storage:/app/storage
      - ./fixtures:/app/fixtures:ro
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: screenai-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
